[package]
name = "bot-whatsapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WhatsApp channel adapter for VoteAssist India: a thin reqwest wrapper over the Meta WhatsApp Cloud API plus an Axum webhook receiver, rendering the same core-domain decision engine as interactive list/button messages. See docs/PRD-V2-RUST-PLATFORM.md Section 6.7 and E8.F2."

[[bin]]
name = "voteassist-bot-whatsapp"
path = "src/main.rs"

[dependencies]
core-domain = { workspace = true }
kb-content = { workspace = true }
channel-core = { workspace = true }
axum = "0.7"
axum-prometheus = "0.7"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
chrono = { workspace = true }
sqlx = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
