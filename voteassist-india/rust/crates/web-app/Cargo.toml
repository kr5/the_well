[package]
name = "web-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Public citizen-facing site for VoteAssist India: Leptos SSR + islands, per docs/PRD-V2-RUST-PLATFORM.md Section 6.6 and docs/05-information-architecture.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# core-domain/kb-content are pure, zero-I/O logic crates (serde/serde_json/
# schemars/thiserror only — no tokio, no filesystem, no network), so they
# compile cleanly for wasm32 and are NOT feature-gated: server-function
# signatures shared between the `ssr` and `hydrate` builds reference their
# types (`EngineState`, `KnowledgeEntry`, `Topic`) directly, so both build
# targets need the type definitions even though only the `ssr` build ever
# calls their actual logic (the `#[server]` macro compiles the real
# function bodies out of the client/wasm build entirely — see
# `src/server_fns.rs`'s module doc). This app's architecture
# (docs/PRD-V2-RUST-PLATFORM.md Section 8.7, "client-held state") has the
# browser hold the current `EngineState` and the *server* re-evaluate
# "given this state and this answer, what's next" on every round trip —
# the client renders what the server function returns, it never runs the
# decision engine itself.
core-domain = { workspace = true }
kb-content = { workspace = true }
# Locale metadata (script, direction, font stack, shipped/planned status)
# and the UI-chrome string dictionary (t()). Same reasoning as
# core-domain/kb-content above: wasm32-safe by design (its own Cargo.toml
# depends on only serde/serde_json, no tokio/sqlx/filesystem/network — see
# its README), and both `locale.rs`'s server functions (ssr) and
# `LanguageSwitcher`/`QuestionFlow` (hydrate, calling native_name/t()
# client-side) need its types, so this is a plain, non-optional dependency
# rather than ssr-feature-gated.
i18n = { workspace = true }

# Wasm32-safe (no OS-specific timezone lookups used here — only
# Utc/DateTime<Utc>), same reasoning as admin-app's own Cargo.toml: a
# plain dependency because account/draft timestamp fields
# (server_fns_accounts.rs's DraftSummary etc.) cross the server-function
# wire boundary.
chrono = { workspace = true }

# Only the bare `Uuid` type crosses the client/server wire (as
# `WalkthroughView::session_id`), which needs no OS randomness and is
# wasm32-safe with just the "serde" feature — `Uuid::new_v4()` (which does
# need a random source) is only ever called from ssr-only code, so the
# "v4" feature is enabled separately, only under the `ssr` feature below,
# rather than unconditionally here.
uuid = { version = "1", features = ["serde"] }

leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
server_fn = { version = "0.8" }
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.9", features = ["cookie"], optional = true }
http = { version = "1", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
sqlx = { workspace = true, optional = true }
tower-http = { version = "0.5", features = ["compression-gzip"], optional = true }
axum-prometheus = { version = "0.7", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"], optional = true }
# Records session_started/question_answered/terminal_reached/
# kb_search_performed/kb_entry_viewed events, gated on the analytics-
# consent cookie (see server_fns.rs's analytics_consent_given). Not
# wasm32-safe (pulls in sqlx), so ssr-only like sqlx itself.
analytics = { path = "../analytics", optional = true }
# server_fns_accounts.rs's save_draft/get_draft serialize EngineState's
# answer history to/from JSONB via serde_json::to_value/from_value,
# entirely inside #[server] fn bodies — ssr-only, like sqlx itself.
serde_json = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:axum",
    "dep:axum-extra",
    "dep:http",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:tower-http",
    "dep:axum-prometheus",
    "dep:pulldown-cmark",
    "dep:sqlx",
    "dep:argon2",
    "dep:rand",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:lettre",
    "dep:analytics",
    "dep:serde_json",
    "uuid/v4",
    "dep:tracing",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Defines a size-optimized profile for the WASM bundle in release mode.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "voteassist-web-app"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "PROD"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
