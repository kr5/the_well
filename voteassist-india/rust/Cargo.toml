[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/kb-content",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
proptest = "1"
